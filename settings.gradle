pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'KikuGie Snapshots'
			url = 'https://maven.kikugie.dev/snapshots'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.7'
}

stonecutter {
	kotlinController = false
	centralScript = 'build.gradle'

	create(rootProject) {
		versions '26.1', '26.2'
		vcsVersion = '26.2'
	}
}

rootProject.name = 'glow-my-teammates'
